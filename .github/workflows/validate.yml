name: Validate website scripts

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.js"
      - ".github/workflows/validate.yml"

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
